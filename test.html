<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Design</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#061a4b;
    padding:40px;
}

.banner{
    background:linear-gradient(90deg,#021b56,#0a1e74,#3f0d84);
    border-radius:22px;
    padding:18px;
    color:#fff;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.info-box{
    border-right:1px solid rgba(255,255,255,0.15);
}

.icon-circle{
    width:80px;
    height:80px;
    border-radius:20px;
    background:linear-gradient(180deg,#12a5ff,#0047ff);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 0 18px rgba(0,132,255,0.4);
}

.icon-circle i{
    font-size:38px;
}

.check{
    position:absolute;
    right:-5px;
    bottom:-5px;
    width:28px;
    height:28px;
    background:#12d86b;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    border:3px solid #fff;
}

.green{
    color:#21e76b;
}

.btn-card{
    border-radius:18px;
    padding:18px 22px;
    color:#fff;
    height:100%;
    display:flex;
    align-items:center;
    gap:15px;
    transition:0.3s;
}

.btn-card:hover{
    transform:translateY(-4px);
}

.whatsapp{
    background:linear-gradient(90deg,#118c4f,#005e3a);
}

.call{
    background:linear-gradient(90deg,#005eff,#143bbf);
}

.record{
    background:linear-gradient(90deg,#8f1dff,#ff33cc);
}

.btn-icon{
    font-size:34px;
}

.small-text{
    color:#d5d5d5;
    font-size:14px;
}

</style>
</head>
<body>

<div class="container">

<div class="banner row align-items-center g-3">

    <!-- Left Section -->
    <div class="col-lg-4 info-box">
        <div class="d-flex align-items-center gap-3">

            <div class="icon-circle">
                <i class="bi bi-person-fill"></i>

                <div class="check">
                    <i class="bi bi-check-lg text-white"></i>
                </div>
            </div>

            <div>
                <h3 class="fw-bold mb-1">
                    Need a <span class="green">Trusted Maid</span><br>
                    or <span class="green">caretaker?</span>
                </h3>

                <p class="small-text mb-0">
                    We're just a call or chat away!
                </p>
            </div>

        </div>
    </div>

    <!-- WhatsApp -->
    <div class="col-lg-3">
        <div class="btn-card whatsapp">
            <i class="bi bi-whatsapp btn-icon"></i>

            <div>
                <h5 class="mb-1">WhatsApp Now</h5>
                <small>Chat with us</small>
            </div>
        </div>
    </div>

    <!-- Call -->
    <div class="col-lg-2">
        <div class="btn-card call">
            <i class="bi bi-telephone-fill btn-icon"></i>

            <div>
                <h5 class="mb-1">Call Us Now</h5>
                <small>Speak to our team</small>
            </div>
        </div>
    </div>

    <!-- Record -->
    <div class="col-lg-3">
        <div class="btn-card record">
            <i class="bi bi-mic-fill btn-icon"></i>

            <div>
                <h5 class="mb-1">Record Your Details</h5>
                <small>We'll call you back</small>
            </div>
        </div>
    </div>

</div>

</div>

</body>
</html>
