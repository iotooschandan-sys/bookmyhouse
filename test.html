<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Features Section</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    body{
      background:#f5f5f5;
      padding:40px;
      font-family:Arial, sans-serif;
    }

    .feature-wrapper{
      background:#fff;
      border-radius:18px;
      padding:22px 25px;
      box-shadow:0 4px 18px rgba(0,0,0,0.06);
    }

    .feature-box{
      display:flex;
      align-items:center;
      gap:12px;
      transition:0.3s;
    }

    .feature-box:hover{
      transform:translateY(-3px);
    }

    .feature-icon{
      width:48px;
      height:48px;
      min-width:48px;
      border-radius:50%;
      border:1.5px solid #d9d9e8;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#2d2d66;
      font-size:22px;
      background:#fff;
    }

    .feature-text h5{
      margin:0;
      font-size:15px;
      font-weight:700;
      color:#2d2d66;
      line-height:1.2;
    }

    .feature-text p{
      margin:0;
      font-size:13px;
      color:#666;
      line-height:1.3;
    }

    @media(max-width:768px){

      .feature-wrapper{
        padding:18px;
      }

      .feature-box{
        margin-bottom:18px;
      }
    }

  </style>
</head>
<body>

<div class="container">

  <div class="feature-wrapper">

    <div class="row g-4">

      <!-- 1 -->
      <div class="col-lg-3 col-md-6">

        <div class="feature-box">

          <div class="feature-icon">
            <i class="fa-regular fa-shield"></i>
          </div>

          <div class="feature-text">
            <h5>Police</h5>
            <p>Verified</p>
          </div>

        </div>

      </div>

      <!-- 2 -->
      <div class="col-lg-3 col-md-6">

        <div class="feature-box">

          <div class="feature-icon">
            <i class="fa-solid fa-users"></i>
          </div>

          <div class="feature-text">
            <h5>Experienced</h5>
            <p>Staff</p>
          </div>

        </div>

      </div>

      <!-- 3 -->
      <div class="col-lg-3 col-md-6">

        <div class="feature-box">

          <div class="feature-icon">
            <i class="fa-solid fa-rotate"></i>
          </div>

          <div class="feature-text">
            <h5>Quick</h5>
            <p>Replacement</p>
          </div>

        </div>

      </div>

      <!-- 4 -->
      <div class="col-lg-3 col-md-6">

        <div class="feature-box">

          <div class="feature-icon">
            <i class="fa-solid fa-award"></i>
          </div>

          <div class="feature-text">
            <h5>Trusted by</h5>
            <p>1000+ Families</p>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>

</body>
</html>
