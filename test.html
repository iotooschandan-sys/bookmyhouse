<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voice Record Popup</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f3f4f6;
    }

    /* Main Button */

    .job-btn{
      padding:18px 35px;
      border:none;
      border-radius:50px;
      background:#0b1b4d;
      color:#fff;
      font-size:22px;
      font-weight:700;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
    }

    .job-btn:hover{
      background:#25D366;
      transform:translateY(-3px);
    }

    /* Popup */

    .popup{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .popup-box{
      width:90%;
      max-width:450px;
      background:#fff;
      border-radius:24px;
      padding:35px;
      text-align:center;
      animation:popup 0.4s ease;
    }

    @keyframes popup{

      from{
        opacity:0;
        transform:scale(0.7);
      }

      to{
        opacity:1;
        transform:scale(1);
      }

    }

    .popup-box h2{
      margin-bottom:25px;
      color:#0b1b4d;
      font-size:30px;
    }

    /* Buttons Area */

    .btn-area{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-bottom:25px;
    }

    /* Record Button */

    .record-btn{
      width:90px;
      height:90px;
      border:none;
      border-radius:50%;
      background:#ff3b30;
      color:#fff;
      font-size:34px;
      cursor:pointer;
      transition:0.3s;
    }

    .record-btn:hover{
      transform:scale(1.08);
    }

    /* Stop Button */

    .stop-btn{
      width:90px;
      height:90px;
      border:none;
      border-radius:50%;
      background:#0b1b4d;
      color:#fff;
      font-size:30px;
      cursor:pointer;
      transition:0.3s;
    }

    .stop-btn:hover{
      transform:scale(1.08);
      background:#111827;
    }

    /* Recording Animation */

    .recording{
      animation:pulse 1s infinite;
    }

    @keyframes pulse{

      0%{
        box-shadow:0 0 0 0 rgba(255,59,48,0.7);
      }

      70%{
        box-shadow:0 0 0 20px rgba(255,59,48,0);
      }

      100%{
        box-shadow:0 0 0 0 rgba(255,59,48,0);
      }

    }

    /* Text Area */

    textarea{
      width:100%;
      height:140px;
      border:2px solid #ddd;
      border-radius:14px;
      padding:16px;
      resize:none;
      outline:none;
      font-size:16px;
      margin-bottom:20px;
    }

    textarea:focus{
      border-color:#25D366;
    }

    /* Close Button */

    .close-btn{
      padding:14px 30px;
      border:none;
      border-radius:12px;
      background:#0b1b4d;
      color:#fff;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .close-btn:hover{
      background:#25D366;
    }

  </style>

</head>
<body>

  <!-- Main Button -->

  <button class="job-btn" id="openPopup">
    Looking For A Job
  </button>

  <!-- Popup -->

  <div class="popup" id="popup">

    <div class="popup-box">

      <h2>Record Your Voice</h2>

      <!-- Record + Stop Buttons -->

      <div class="btn-area">

        <button class="record-btn" id="recordBtn">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <button class="stop-btn" id="stopBtn">
          <i class="fa-solid fa-stop"></i>
        </button>

      </div>

      <!-- Text Output -->

      <textarea id="messageBox"
      placeholder="Your voice text will appear here..."></textarea>

      <!-- Close -->

      <button class="close-btn" id="closePopup">
        Close
      </button>

    </div>

  </div>

  <script>

    const popup = document.getElementById("popup");
    const openPopup = document.getElementById("openPopup");
    const closePopup = document.getElementById("closePopup");

    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");

    const messageBox = document.getElementById("messageBox");

    let recognition;

    // Open Popup

    openPopup.onclick = () => {

      popup.style.display = "flex";

    };

    // Close Popup

    closePopup.onclick = () => {

      popup.style.display = "none";

    };

    // Speech Recognition

    if ('webkitSpeechRecognition' in window) {

      recognition = new webkitSpeechRecognition();

      recognition.continuous = true;

      recognition.interimResults = true;

      recognition.lang = "en-US";

      recognition.onresult = function(event){

        let transcript = '';

        for(let i = event.resultIndex;
            i < event.results.length;
            i++){

          transcript += event.results[i][0].transcript;

        }

        messageBox.value = transcript;

      };

    }

    // Start Recording

    recordBtn.onclick = () => {

      recognition.start();

      recordBtn.classList.add("recording");

    };

    // Stop Recording

    stopBtn.onclick = () => {

      recognition.stop();

      recordBtn.classList.remove("recording");

    };

  </script>

</body>
</html>
