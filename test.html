<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Service Locations</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#fff;
      padding:40px 20px;
    }

    .service-location{
      max-width:1200px;
      margin:auto;
      text-align:center;
    }

    .top-text{
      color:#5ca56f;
      font-size:13px;
      font-weight:600;
      letter-spacing:1px;
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .heading{
      font-size:38px;
      color:#1b2559;
      font-weight:700;
      margin-bottom:35px;
    }

    .location-wrapper{
      display:flex;
      justify-content:center;
      gap:22px;
      flex-wrap:wrap;
      margin-bottom:28px;
    }

    .location-box{
      width:120px;
      padding:14px 10px;
      border:1px solid #efefef;
      border-radius:14px;
      background:#fff;
      transition:0.3s ease;
      cursor:pointer;
    }

    .location-box:hover{
      transform:translateY(-5px);
      box-shadow:0 8px 18px rgba(0,0,0,0.08);
    }

    .location-box img{
      width:58px;
      height:auto;
      margin-bottom:10px;
      object-fit:contain;
    }

    .location-box h4{
      font-size:13px;
      color:#1b2559;
      font-weight:600;
    }

    .view-btn{
      border:1px solid #d8d8d8;
      background:#fff;
      border-radius:30px;
      padding:12px 26px;
      font-size:14px;
      font-weight:600;
      color:#1b2559;
      display:inline-flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .view-btn:hover{
      background:#f8f8f8;
    }

    .view-btn span{
      width:22px;
      height:22px;
      border-radius:50%;
      background:#1b2559;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
    }

    @media(max-width:768px){

      .heading{
        font-size:28px;
      }

      .location-wrapper{
        gap:15px;
      }

      .location-box{
        width:100px;
      }

      .location-box img{
        width:48px;
      }
    }
  </style>
</head>

<body>

<section class="service-location">

  <p class="top-text">WE SERVE ACROSS DELHI NCR</p>

  <h2 class="heading">Our Service Locations</h2>

  <div class="location-wrapper">

    <div class="location-box">
      <img src="images/delhi.png" alt="Delhi">
      <h4>Delhi</h4>
    </div>

    <div class="location-box">
      <img src="images/gurgaon.png" alt="Gurgaon">
      <h4>Gurgaon</h4>
    </div>

    <div class="location-box">
      <img src="images/noida.png" alt="Noida">
      <h4>Noida</h4>
    </div>

    <div class="location-box">
      <img src="images/ghaziabad.png" alt="Ghaziabad">
      <h4>Ghaziabad</h4>
    </div>

    <div class="location-box">
      <img src="images/faridabad.png" alt="Faridabad">
      <h4>Faridabad</h4>
    </div>

    <div class="location-box">
      <img src="images/rohini.png" alt="Rohini">
      <h4>Rohini</h4>
    </div>

    <div class="location-box">
      <img src="images/south-delhi.png" alt="South Delhi">
      <h4>South Delhi</h4>
    </div>

  </div>

  <button class="view-btn">
    View All Locations
    <span>➜</span>
  </button>

</section>

</body>
</html>
