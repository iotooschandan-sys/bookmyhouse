<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhatsApp Button</title>

  <!-- Font Awesome Icon -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f2f2f2;
      font-family:Arial, sans-serif;
    }

    .whatsapp-btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      background:#25D366;
      color:white;
      padding:14px 24px;
      border-radius:50px;
      text-decoration:none;
      font-size:18px;
      font-weight:bold;
      transition:0.3s ease;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .whatsapp-btn:hover{
      background:#1ebe5d;
      transform:scale(1.05);
    }

    .whatsapp-btn i{
      font-size:24px;
    }
  </style>
</head>
<body>

  <a href="https://wa.me/919999999999" class="whatsapp-btn" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
    Chat on WhatsApp
  </a>

</body>
</html>
