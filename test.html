<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Step Form</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background: #f3f3f3;
            font-family: Arial, sans-serif;
        }

        .main-box {
            max-width: 550px;
            margin: 40px auto;
        }

        .heading1 {
            text-align: center;
            font-size: 38px;
            font-weight: 700;
            color: #16358b;
            margin-bottom: 35px;
        }

        /* =========================
           DROPDOWN
        ========================= */

        .dropdown-wrapper {
            position: relative;
        }

        .service-select {
            border: 2px solid #d6d6d6;
            border-radius: 14px;
            background: #fff;
            padding: 16px 22px;
            cursor: pointer;
        }

        .service-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .service-icon {
            width: 52px;
            height: 52px;
            background: #f2f2f2;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .service-title {
            margin: 0;
            font-size: 22px;
            font-weight: 500;
        }

        .service-dropdown {
            position: absolute;
            width: 100%;
            top: 100%;
            left: 0;
            background: #fff;
            border: 2px solid #d8d8d8;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            z-index: 99;
        }

        .service-dropdown.show {
            display: block;
        }

        .dropdown-item-custom {
            padding: 15px 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            cursor: pointer;
        }

        .dropdown-item-custom:hover {
            background: #f3f3f3;
        }

        .dropdown-item-custom.active {
            background: #ececec;
        }

        .dropdown-item-custom h5 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        /* =========================
           OPTIONS
        ========================= */

        .service-option {
            border: 2px solid #d9d9d9;
            border-radius: 14px;
            background: #fff;
            padding: 18px 22px;
            margin-top: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .service-option.active {
            border-color: #0d6efd;
            background: #eef3ff;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .option-title {
            margin: 0;
            font-size: 22px;
            font-weight: 500;
        }

        /* =========================
           BUTTON
        ========================= */

        .btn-3d {
            border: none;
            background: #0d6efd;
            color: #fff;
            padding: 12px 35px;
            border-radius: 5px;
            font-size: 20px;
            font-weight: 600;
        }

        /* =========================
           GENDER CARD
        ========================= */

        .gender-card {
            background: #fff;
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.3s;
        }

        .gender-card.active-gender {
            border-color: #0d6efd;
            background: #eef3ff;
        }

        .gender-img {
            width: 100px;
            height: 100px;
            background: #f2f2f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: auto auto 15px;
        }

        .gender-card h4 {
            font-size: 22px;
            color: #16358b;
            margin: 0;
            font-weight: 600;
        }

        /* =========================
           FORM
        ========================= */

        .form-group-custom {
            margin-top: 18px;
        }

        .custom-input {
            height: 58px;
            border: 1px solid #cfd4dc;
            font-size: 20px;
            box-shadow: none !important;
        }

        .custom-textarea {
            border: 1px solid #cfd4dc;
            font-size: 20px;
            box-shadow: none !important;
        }

        .country-code {
            font-size: 22px;
        }
    </style>

</head>

<body>


    <div class="container">


        <!-- =========================
             PAGE 1
        ========================= -->

        <div class="main-box" id="page1">

            <h3 class="heading1">
                What Do You Want Your Maid To Do ?
            </h3>
            <!-- DROPDOWN -->
            <div class="dropdown-wrapper">
                <div class="service-select d-flex justify-content-between align-items-center" id="selectBox">
                    <div class="service-left">
                        <div class="service-icon" id="selectedIcon">
                            🧹
                        </div>
                        <h4 class="service-title" id="selectedText">
                            Maid
                        </h4>
                    </div>
                    <i class="fa-solid fa-chevron-down" id="arrow"></i>
                </div>

                <!-- MENU -->
                <div class="service-dropdown" id="dropdownMenu">
                    <div class="dropdown-item-custom active">
                        <div class="service-icon">🧹</div>
                        <h5>Maid</h5>
                    </div>
                    <div class="dropdown-item-custom">
                        <div class="service-icon">👨‍🍳</div>
                        <h5>Cook</h5>

                    </div>

                    <div class="dropdown-item-custom">

                        <div class="service-icon">👩‍🍼</div>
                        <h5>Baby Sitter</h5>

                    </div>

                    <div class="dropdown-item-custom">

                        <div class="service-icon">💆</div>
                        <h5>Baby Massage</h5>

                    </div>

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="service-option d-flex justify-content-between align-items-center">

                <div class="option-left">

                    <div class="service-icon">⏰</div>

                    <h4 class="option-title">
                        Urgent Need
                    </h4>

                </div>

            </div>


            <div class="service-option d-flex justify-content-between align-items-center">

                <div class="option-left">

                    <div class="service-icon">🐌</div>

                    <h4 class="option-title">
                        Needed Later
                    </h4>

                </div>

            </div>


            <div class="service-option active d-flex justify-content-between align-items-center">

                <div class="option-left">

                    <div class="service-icon">📋</div>

                    <h4 class="option-title">
                        I'm Just Planning
                    </h4>

                </div>

            </div>


            <!-- NEXT -->

            <div class="text-center mt-4">

                <button class="btn-3d" id="nextBtn">
                    Next
                </button>

            </div>

        </div>



        <!-- =========================
             PAGE 2
        ========================= -->

        <div class="main-box d-none" id="page2">

            <h3 class="heading1">
                Which Gender Do You Prefer?
            </h3>


            <div class="row g-3">

                <div class="col-4">

                    <div class="gender-card">

                        <div class="gender-img">
                            👨
                        </div>

                        <h4>Male</h4>

                    </div>

                </div>


                <div class="col-4">

                    <div class="gender-card active-gender">

                        <div class="gender-img">
                            👩
                        </div>

                        <h4>Female</h4>

                    </div>

                </div>


                <div class="col-4">

                    <div class="gender-card">

                        <div class="gender-img">
                            👨‍👩
                        </div>

                        <h4>Any</h4>

                    </div>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="text-center mt-4 d-flex justify-content-center gap-3">

                <button class="btn-3d" id="prevBtn">
                    Previous
                </button>

                <button class="btn-3d" id="genderNextBtn">
                    Next
                </button>

            </div>

        </div>



        <!-- =========================
             PAGE 3
        ========================= -->

        <div class="main-box d-none" id="page3">

            <h3 class="heading1">
                Enter Your Mobile No.
            </h3>


            <!-- MOBILE -->

            <div class="form-group-custom">

                <div class="input-group">

                    <span class="input-group-text country-code">
                        +91
                    </span>

                    <input type="text" class="form-control custom-input" placeholder="Enter Your Mobile No">

                </div>

            </div>


            <!-- NAME -->

            <div class="form-group-custom">

                <input type="text" class="form-control custom-input" placeholder="Enter Name">

            </div>


            <!-- LOCATION -->

            <div class="form-group-custom">

                <input type="text" class="form-control custom-input" placeholder="Enter Your Location">

            </div>


            <!-- HOURS -->

            <div class="form-group-custom">

                <input type="text" class="form-control custom-input" placeholder="How many hours do you need">

            </div>


            <!-- MESSAGE -->

            <div class="form-group-custom">

                <textarea rows="3" class="form-control custom-textarea" placeholder="Enter Message"></textarea>

            </div>


            <!-- BUTTONS -->

            <div class="text-center mt-4 d-flex justify-content-center gap-3">

                <button class="btn-3d" id="backBtn">
                    Previous
                </button>

                <button class="btn-3d">
                    Submit
                </button>

            </div>

        </div>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        // =========================
        // DROPDOWN
        // =========================

        const selectBox =
            document.getElementById("selectBox");

        const dropdownMenu =
            document.getElementById("dropdownMenu");

        const arrow =
            document.getElementById("arrow");


        selectBox.addEventListener("click", () => {

            dropdownMenu.classList.toggle("show");

            if (dropdownMenu.classList.contains("show")) {

                arrow.classList.remove("fa-chevron-down");
                arrow.classList.add("fa-chevron-up");

            } else {

                arrow.classList.remove("fa-chevron-up");
                arrow.classList.add("fa-chevron-down");

            }

        });



        // =========================
        // SELECT SERVICE
        // =========================

        const items =
            document.querySelectorAll(".dropdown-item-custom");


        items.forEach(item => {

            item.addEventListener("click", function () {

                const icon =
                    this.querySelector(".service-icon").innerHTML;

                const text =
                    this.querySelector("h5").innerText;


                document.getElementById("selectedIcon")
                    .innerHTML = icon;

                document.getElementById("selectedText")
                    .innerText = text;


                items.forEach(el =>
                    el.classList.remove("active")
                );

                this.classList.add("active");


                dropdownMenu.classList.remove("show");

                arrow.classList.remove("fa-chevron-up");
                arrow.classList.add("fa-chevron-down");

            });

        });



        // =========================
        // PAGE 1 -> PAGE 2
        // =========================

        document.getElementById("nextBtn")
            .addEventListener("click", function () {

                document.getElementById("page1")
                    .classList.add("d-none");

                document.getElementById("page2")
                    .classList.remove("d-none");

            });



        // =========================
        // PAGE 2 -> PAGE 1
        // =========================

        document.getElementById("prevBtn")
            .addEventListener("click", function () {

                document.getElementById("page2")
                    .classList.add("d-none");

                document.getElementById("page1")
                    .classList.remove("d-none");

            });



        // =========================
        // GENDER ACTIVE
        // =========================

        const genderCards =
            document.querySelectorAll(".gender-card");


        genderCards.forEach(card => {

            card.addEventListener("click", function () {

                genderCards.forEach(el =>
                    el.classList.remove("active-gender")
                );

                this.classList.add("active-gender");

            });

        });



        // =========================
        // PAGE 2 -> PAGE 3
        // =========================

        document.getElementById("genderNextBtn")
            .addEventListener("click", function () {

                document.getElementById("page2")
                    .classList.add("d-none");

                document.getElementById("page3")
                    .classList.remove("d-none");

            });



        // =========================
        // PAGE 3 -> PAGE 2
        // =========================

        document.getElementById("backBtn")
            .addEventListener("click", function () {

                document.getElementById("page3")
                    .classList.add("d-none");

                document.getElementById("page2")
                    .classList.remove("d-none");

            });

    </script>

</body>

</html>
